<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAPACITY CONNECT — Digital Capacity Building & LMS Portal</title>
  <meta name="description" content="Centralized, role-based Learning Management and Digital Capacity Building Portal with Competency Mapping, Unified Trainer Library, and Verifiable Certifications for Smart India Hackathon (SIH)." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e40af" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e40af'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js for Executive Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti for Celebratory Achievements -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="h-full flex flex-col bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
  <!-- Top Navigation Bar Container -->
  <div id="navbar-container"></div>

  <!-- Main Viewport Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Role-Specific Sidebar Container -->
    <div id="sidebar-wrapper"></div>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto px-4 sm:px-6 lg:px-8 py-6 max-w-7xl w-full mx-auto">
      <div id="main-content">
        <!-- Rendered reactively via js/app.js -->
        <div class="flex items-center justify-center min-h-[60vh]">
          <div class="flex items-center gap-3 text-slate-500 font-bold text-sm">
            <svg class="animate-spin h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Loading CAPACITY CONNECT System...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Persistent Interactive Modals -->
  <div id="auth-modal-container"></div>
  <div id="certificate-modal-container"></div>
  <div id="feedback-modal-container"></div>
  <div id="presentation-modal-container"></div>

  <!-- Floating Toast Notification Stack -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registered:', reg.scope))
          .catch(err => console.log('Service Worker registration skipped:', err));
      });
    }
  </script>

  <!-- Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
